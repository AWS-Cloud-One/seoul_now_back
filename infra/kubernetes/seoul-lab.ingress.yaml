# W5-B: apply after seoul-now-lab-edge-network finishes CREATE_COMPLETE.
# EKS owns ALB/listeners/targets; CloudFormation owns the referenced frontend SG.
# CloudFront's default certificate terminates viewer HTTPS. This private hop is HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seoul-now-api
  namespace: seoul-now
  labels:
    app.kubernetes.io/name: seoul-now
    app.kubernetes.io/component: api
  annotations:
    alb.ingress.kubernetes.io/load-balancer-name: seoul-now-lab-api
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/ip-address-type: ipv4
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/subnets: subnet-0d8010197c33c9570,subnet-0c6ef58a04245f298
    # Controller resolves this by the SG's Name tag, not its GroupName.
    alb.ingress.kubernetes.io/security-groups: seoul-now-lab-api-alb
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: 'true'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health/ready
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: '15'
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: '6'
    alb.ingress.kubernetes.io/healthy-threshold-count: '2'
    alb.ingress.kubernetes.io/unhealthy-threshold-count: '2'
    alb.ingress.kubernetes.io/success-codes: '200'
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120,routing.http.drop_invalid_header_fields.enabled=true
    alb.ingress.kubernetes.io/tags: Project=seoul-now,Environment=lab
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/v2/chat
            pathType: Prefix
            backend:
              service:
                name: seoul-now-api
                port:
                  number: 80
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: seoul-now-api
                port:
                  number: 80
