# Only application/bootstrap stdout is collected; no Container Insights metrics.
# Pod Identity supplies credentials. The CloudFormation log group owns retention.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-for-fluent-bit
  namespace: amazon-cloudwatch
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush                     5
        Grace                     30
        Log_Level                 info
        HTTP_Server               On
        HTTP_Listen               0.0.0.0
        HTTP_Port                 2020
        Health_Check              On
    [INPUT]
        Name                      tail
        Tag                       application.*
        Path                      /var/log/containers/*_seoul-now_*.log,/var/log/containers/*_seoul-now-bootstrap_*.log
        multiline.parser          docker, cri
        DB                        /var/fluent-bit/state/tail.db
        Mem_Buf_Limit             10MB
        Skip_Long_Lines           On
        Refresh_Interval          5
        Rotate_Wait               30
        Read_from_Head             On
    [OUTPUT]
        Name                      cloudwatch_logs
        Match                     application.*
        region                    ${AWS_REGION}
        log_group_name            ${APPLICATION_LOG_GROUP}
        log_stream_prefix         pod-
        auto_create_group         false
        Retry_Limit               5
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: aws-for-fluent-bit
  namespace: amazon-cloudwatch
spec:
  selector:
    matchLabels:
      app: aws-for-fluent-bit
  template:
    metadata:
      labels:
        app: aws-for-fluent-bit
    spec:
      serviceAccountName: aws-for-fluent-bit
      terminationGracePeriodSeconds: 45
      nodeSelector:
        kubernetes.io/os: linux
      containers:
        - name: fluent-bit
          image: public.ecr.aws/aws-observability/aws-for-fluent-bit:2.34.3.20261102
          imagePullPolicy: IfNotPresent
          env:
            - name: AWS_REGION
              value: ap-northeast-2
            - name: APPLICATION_LOG_GROUP
              value: /seoul-now/seoul-now/lab/application
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: health
              containerPort: 2020
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: health
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: health
            initialDelaySeconds: 30
          volumeMounts:
            - name: config
              mountPath: /fluent-bit/etc/fluent-bit.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: varlog
              mountPath: /var/log
              readOnly: true
            - name: state
              mountPath: /var/fluent-bit/state
      volumes:
        - name: config
          configMap:
            name: aws-for-fluent-bit
        - name: varlog
          hostPath:
            path: /var/log
            type: Directory
        - name: state
          emptyDir:
            sizeLimit: 100Mi
