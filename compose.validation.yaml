# Dedicated database and volume; never points integration tests at application data.
name: seoul-now-refresh-validation

x-validation: &validation
  build:
    context: .
    target: development
  environment:
    APP_DATABASE_URL: postgresql+psycopg://validation:validation_local@db:5432/validation
    TEST_DATABASE_URL: postgresql+psycopg://validation:validation_local@db:5432/validation
  healthcheck:
    disable: true

services:
  db:
    image: postgis/postgis:17-3.6@sha256:eeead53aa76f9219eac3af490e00484a7dd604dbcbc3ed2ae0e96668986f16f3
    platform: linux/amd64
    environment:
      POSTGRES_DB: validation
      POSTGRES_USER: validation
      POSTGRES_PASSWORD: validation_local
    volumes:
      - validation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U validation -d validation"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    <<: *validation
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  tests:
    <<: *validation
    command: ["pytest", "-q"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  validation_data:
